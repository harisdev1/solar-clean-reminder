name: solar_clean
description: Solar panel cleaning reminder with alarm, Google login, Material 3 Expressive UI.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  google_sign_in: ^7.1.0
  flutter_bloc: ^9.1.0
  # keep on 19.x — v20 changed method signatures to named params
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  dynamic_color: ^1.7.0
  flutter_animate: ^4.5.2
  intl: ^0.20.2
  permission_handler: ^13.0.2
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon_launcher.png
  adaptive_icon_background: "#08286E"
  adaptive_icon_foreground: assets/icons/app_icon_launcher.png
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true
  assets:
    - assets/icons/image.png
    - assets/icons/app_icon.png
    - assets/icons/app_icon_launcher.png
